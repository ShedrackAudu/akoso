# Local development services only. Never point these at real data (working rule 7).
# Credentials below are local defaults, not secrets; staging and production use the
# hosting provider's secret store.
name: akoso

services:
  postgres:
    # Exact version and digest (T10). Renovate proposes updates.
    image: postgres:16.16-alpine3.24@sha256:0adbf25a9e96d38823bb813f3ac0ed41fadb665c88f1df7fe6dbfb060cbdc106
    environment:
      POSTGRES_USER: akoso_owner
      POSTGRES_PASSWORD: akoso_local_only
      POSTGRES_DB: akoso_dev
      TZ: UTC
    ports:
      # 5433 on the host: 5432 is often taken by a locally installed PostgreSQL.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the least-privilege roles on first start (see the file for each role).
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akoso_owner -d akoso_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Connection pooler in transaction mode, as managed Postgres is usually pooled in
  # production. The app connects here (port 6432), never straight to Postgres.
  pgbouncer:
    image: edoburu/pgbouncer:v1.26.1-p0@sha256:488422e38cff912895d0d65d8963fcd306e6ac589a724398b6eb8e294e94d624
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "6432:6432"
    volumes:
      - ./docker/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./docker/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro

  # HTML-to-PDF rendering for report cards, receipts and payslips. Called only by the worker.
  # Pinned (spike 03). The Chromium-only image: report cards need no office formats.
  # Locked down: no JavaScript in templates, and Chromium may not fetch anything from
  # any network, public or private. Every asset is uploaded with the HTML.
  gotenberg:
    image: gotenberg/gotenberg:9.4.0-chromium@sha256:ad6dbcf5923f0888fb25462adc4c3a8580ef163cae07acc8e45d0703ff10cad7
    command:
      - gotenberg
      - --chromium-disable-javascript=true
      - --chromium-deny-public-ips=true
      - --chromium-deny-private-ips=true
      - --chromium-auto-start=true
    ports:
      - "3100:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # No local object storage yet: MinIO stopped publishing images (ADR 0005). A
  # replacement standing in for Cloudflare R2 is chosen in the file-storage spec.

volumes:
  postgres-data:
