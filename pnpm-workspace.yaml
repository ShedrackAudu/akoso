packages:
  - "apps/*"
  - "packages/*"

# Only these packages may run install scripts (supply-chain rule, brief section 28.3).
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  # Pulled in by @serwist/turbopack. Its script only checks the native binary, which
  # arrives as a platform package anyway, and would otherwise download a fallback.
  "@swc/core": false

minimumReleaseAgeExclude:
  - knip@6.45.1

# Security fixes for transitive dependencies whose parents pin a vulnerable version.
# Each entry names the advisory; remove it once the parent package ships the fix.
overrides:
  # GHSA-mrhx-c7xc-m3w5 (high): @serwist/turbopack 9.5.13 pins zod 4.6.5.
  "zod@<4.6.6": "^4.6.7"
