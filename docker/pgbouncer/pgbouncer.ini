; Local development only. Mirrors how managed Postgres is usually pooled in
; production: transaction pooling, so a server connection is shared between
; clients from one transaction to the next. That is the mode in which a tenant
; setting that outlives its transaction would leak to another school.

[databases]
akoso_dev = host=postgres port=5432 dbname=akoso_dev

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

pool_mode = transaction
; Small on purpose: fewer server connections than clients forces reuse.
default_pool_size = 2
max_client_conn = 200

; Statements prepared through the pooler are tracked per server connection.
max_prepared_statements = 100

ignore_startup_parameters = extra_float_digits
admin_users = akoso_owner
